# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  test:unit:
    desc: Run unit tests
    cmds:
      - uv run pytest tests --ignore=tests/integration

  test:integration:
    desc: Run integration tests
    cmds:
      - uv run pytest tests/integration

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
