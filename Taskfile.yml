# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  dev:up:
    desc: Build and start the local Compose stack
    cmds:
      - docker compose up --build --wait

  dev:down:
    desc: Stop the local stack and preserve data
    cmds:
      - docker compose down

  dev:teardown:
    desc: Stop the local stack and delete all its data
    cmds:
      - docker compose down --volumes

  test:unit:
    desc: Run unit tests
    cmds:
      - uv run pytest tests --ignore=tests/integration

  test:integration:
    desc: Run integration tests
    cmds:
      - uv run pytest tests/integration

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
