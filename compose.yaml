services:
  api:
    build: .
    environment:
      PLANGATE_TEMPORAL_ADDRESS: temporal:7233
      PLANGATE_REVIEW_STORE_BACKEND: postgres
      PLANGATE_POSTGRES_HOST: postgres
      PLANGATE_POSTGRES_PASSWORD: ${PLANGATE_POSTGRES_PASSWORD:?Set PLANGATE_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - plangate-data:/data
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  temporal:
    image: temporalio/temporal
    # volume mounts as root, we need to fix ownership so temporal can write
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown 1000:1000 /data &&
        exec su -s /bin/sh temporal -c \
          'exec temporal server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db'

    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "127.0.0.1:7233",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  worker:
    build: .
    entrypoint:
      ["uv", "run", "--no-sync", "python", "-m", "plangate.temporal.worker"]
    environment:
      PLANGATE_TEMPORAL_ADDRESS: temporal:7233
      PLANGATE_REVIEW_STORE_BACKEND: postgres
      PLANGATE_POSTGRES_HOST: postgres
      PLANGATE_POSTGRES_PASSWORD: ${PLANGATE_POSTGRES_PASSWORD:?Set PLANGATE_POSTGRES_PASSWORD}

    volumes:
      - plangate-data:/data
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: plangate
      POSTGRES_PASSWORD: ${PLANGATE_POSTGRES_PASSWORD:?Set PLANGATE_POSTGRES_PASSWORD}
      POSTGRES_DB: plangate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "plangate", "-d", "plangate"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  plangate-data:
  prometheus-data:
  temporal-data:
  postgres-data:
